[package]
name = "partii-godot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The native backend of Partii for Godot: a GDExtension over partii-sdk (account, saves, rooms)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "=0.5.5"
partii = { version = "0.2.1", default-features = false, features = ["account", "net"] }
serde_json = "1"

# The player's sign-in token in the OS store: Keychain (macOS), Credential Manager (Windows),
# Secret Service (Linux). Android/iOS come later (Keystore / Keychain through their own plugins).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[profile.release]
strip = true
lto = "thin"
