[package]
name = "partii-godot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The native backend of Partii for Godot: a GDExtension over partii-sdk (account, saves, rooms)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.4"
partii = { git = "https://github.com/PartiiGames/partii-sdk", tag = "v0.2.1", default-features = false, features = ["account", "net"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
